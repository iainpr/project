[project]
name = "zoning-housing-did"
version = "4.0.0"
description = "Staggered difference-in-differences for zoning bylaws and housing supply"
requires-python = ">=3.11"  # pandas 3 and tomllib need Python 3.11+

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
